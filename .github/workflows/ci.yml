name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: okamyuji/reusable-workflows/.github/workflows/rust-ci.yml@v1

  crap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # tools/crap.sh が cyclomatic の算出に使う。crates.io からのビルドは数分かかるため
      # ~/.cargo/bin をキャッシュして 2 回目以降を短縮する
      - uses: actions/cache@v4
        id: rca
        with:
          path: ~/.cargo/bin/rust-code-analysis-cli
          key: rust-code-analysis-cli-${{ runner.os }}-v1
      - if: steps.rca.outputs.cache-hit != 'true'
        run: cargo install rust-code-analysis-cli --locked
      # cargo llvm-cov が統合テストと E2E を実 Iggy コンテナで走らせる
      - run: bash tools/crap.sh

  security:
    permissions:
      contents: read
      pull-requests: write
    uses: okamyuji/reusable-workflows/.github/workflows/security-scan.yml@v1
