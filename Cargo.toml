[package]
name = "agent-audit"
version = "0.1.0"
edition = "2021"
description = "Replay viewer for go-llm-agent audit events stored in Apache Iggy"
license = "MIT"

[dependencies]
iggy = "0.10.0"
ratatui = "0.30"
crossterm = "0.29"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
async-trait = "0.1"
bytes = "1"

[features]
testsupport = []

[dev-dependencies]
jsonschema = "0.52"
unicode-width = "0.2"
tokio = { version = "1", features = ["test-util"] }
uuid = { version = "1", features = ["v4"] }
# 結合テスト・E2Eバイナリはlibクレートを別コンパイル単位として使うので、
# testsupport featureを自分自身に対して有効化しないとdocker起動ヘルパーが見えない。
# release buildはこのfeatureを付けないので、以下のシンボルは含まれない。
agent-audit = { path = ".", features = ["testsupport"] }
